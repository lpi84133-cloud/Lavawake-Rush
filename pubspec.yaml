name: lavawake_rush
description: "Lavawake Rush - control a living lava flow, absorb your enemies and rush through the volcanic world."
publish_to: 'none'
version: 1.0.3+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.22.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  device_info_plus: ^11.4.0
  flutter_secure_storage: ^10.3.1
  appsflyer_sdk: ^6.18.0
  app_tracking_transparency: ^2.0.6+1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  smooth_page_indicator: ^2.0.1
  percent_indicator: ^4.2.5
  shimmer: ^3.0.0
  animated_text_kit: ^4.3.0
  flutter_staggered_animations: ^1.1.1
  carousel_slider: ^5.1.2
  gap: ^3.0.1
  auto_size_text: ^3.0.0
  confetti: ^0.8.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    - assets/sprites/
    - assets/legal/
    - assets/icon/icon.png
    - assets/Lavawake_Rush_sounds_assets/
    - assets/Lavawake_Rush_additional_assets/Game_Name.webp
    - assets/Lavawake_Rush_additional_assets/Horizontal_Loading_Screen.webp
    - assets/Lavawake_Rush_additional_assets/Vertical_Loading_Screen.webp
    - assets/Lavawake_Rush_additional_assets/Horizontal_Notifications_Screen.webp
    - assets/Lavawake_Rush_additional_assets/Vertical_Notifications_Screen.webp
    - assets/Lavawake_Rush_additional_assets/Horizontal_Nowifi_Screen.webp
    - assets/Lavawake_Rush_additional_assets/Vertical_Nowifi_Screen.webp
    - assets/Lavawake_Rush_gameplay_assets/bg_location_1_asset.webp
    - assets/Lavawake_Rush_gameplay_assets/bg_location_2_asset.webp
    - assets/Lavawake_Rush_gameplay_assets/bg_location_3_asset.webp
    - assets/Lavawake_Rush_gameplay_assets/bg_location_4_asset.webp
    - assets/Lavawake_Rush_gameplay_assets/bg_location_5_asset.webp
    - assets/Lavawake_Rush_gameplay_assets/bg_location_6_asset.webp

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-400.ttf
          weight: 400
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  # Full-bleed adaptive icon: the artwork itself is the foreground and covers the
  # whole surface, so the mask crops only the corners and never shows empty edges.
  adaptive_icon_background: "#0B0709"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#0B0709"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0B0709"
    image: assets/icon/splash_logo_android12.png
  android: true
  ios: true
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
